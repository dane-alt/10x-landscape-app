<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>10X Landscape Login</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 360px;
    height: 685px;
    background: #ffffff;
    font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .phone {
    width: 360px;
    height: 685px;
    background: #ffffff;
    position: relative;
  }
  .status {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 28px;
    background: #ffffff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px;
    color: #5a5a5a;
    font-size: 12px;
    font-weight: 500;
  }
  .status-icons { display: flex; gap: 5px; align-items: center; }
  .header {
    position: absolute;
    top: 60px; left: 0; right: 0;
    height: 100px;
    background: linear-gradient(180deg, #F5F5F5 0%, #E2E2E2 18%, #C5C5C5 48%, #A3A3A3 78%, #909090 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 22px;
  }
  .logo {
    font-size: 36px;
    font-weight: 400;
    letter-spacing: 0.2px;
    color: #ffffff;
    -webkit-text-stroke: 0.55px #b0b0b0;
    text-shadow: 0 1px 1px rgba(80,80,80,.28);
    line-height: 1;
  }
  .field {
    position: absolute;
    left: 31px;
    width: 298px;
    height: 49px;
    border-radius: 8px;
    background: #ffffff;
    border: 1px solid #A3A3A3;
    box-shadow: inset 1px 2px 3px rgba(180,180,180,.28);
    display: flex;
    align-items: center;
    padding: 0 14px;
  }
  .email { top: 232px; }
  .password { top: 296px; }
  .field input {
    border: 0;
    outline: 0;
    background: transparent;
    width: 100%;
    font-size: 15px;
    font-weight: 300;
    color: #9a9a9a;
    font-family: inherit;
  }
  .field input::placeholder { color: #c4c4c4; font-weight: 300; }
  .eye { width: 18px; height: 18px; flex: 0 0 18px; }
  .btn {
    position: absolute;
    left: 31px;
    width: 298px;
    height: 49px;
    border: 0;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 1.2px;
    color: #3a3a3a;
    cursor: pointer;
    background: linear-gradient(180deg, #F0F0F0 0%, #D4D4D4 70%, #C8C8C8 100%);
    box-shadow: 0 1px 2px rgba(150,150,150,.28), inset 0 1px 0 #fff;
  }
  .login { top: 361px; }
  .register { top: 460px; }
  .hint {
    position: absolute;
    top: 438px;
    left: 31px;
    width: 298px;
    text-align: left;
    font-size: 13px;
    font-weight: 500;
    color: #5A5A5A;
    -webkit-text-stroke: 0.35px #5A5A5A;
  }
  .finger {
    position: absolute;
    left: 50%;
    top: 608px;
    width: 36px;
    height: 45px;
    transform: translateX(-50%);
    object-fit: contain;
    display: block;
  }
</style>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone" id="login-screen">
    <div class="status">
      <span>10:00</span>
      <span class="status-icons">
        <svg width="14" height="9" viewBox="0 0 14 9" fill="#9a9a9a"><rect x="0" y="6" width="2" height="3"/><rect x="3" y="4.2" width="2" height="4.8"/><rect x="6" y="2.4" width="2" height="6.6"/><rect x="9" y=".6" width="2" height="8.4"/></svg>
        <svg width="12" height="9" viewBox="0 0 12 9" fill="none" stroke="#9a9a9a" stroke-width="1.1"><path d="M1 6.2c1.8-2 4-2.9 6.6 0"/><path d="M2.8 7.2c1.1-1.1 2.4-1.5 3.8 0"/><circle cx="6" cy="8.1" r=".55" fill="#9a9a9a" stroke="none"/></svg>
        <svg width="20" height="9" viewBox="0 0 20 9"><rect x=".4" y="1.1" width="16.2" height="6.8" rx="1.2" stroke="#9a9a9a" fill="none"/><rect x="1.7" y="2.3" width="11" height="4.4" rx=".3" fill="#9a9a9a"/><rect x="17.4" y="2.8" width="1.4" height="3.4" rx=".3" fill="#9a9a9a"/></svg>
      </span>
    </div>
    <div class="header"><div class="logo">10X Landscape</div></div>
    <div class="field email"><input placeholder="E-mail" /></div>
    <div class="field password">
      <input placeholder="Password" type="password" />
      <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="1.2">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </div>
    <button class="btn login">LOGIN</button>
    <div class="hint">Don't have an account yet?</div>
    <button class="btn register">REGISTER</button>
    <img class="finger" src="figma-fingerprint.png" alt="" />
  </div>

  <div class="phone" id="app-screen" hidden>
    <div class="status">
      <span>10:00</span>
      <span class="status-icons">
        <svg width="14" height="9" viewBox="0 0 14 9" fill="#9a9a9a"><rect x="0" y="6" width="2" height="3"/><rect x="3" y="4.2" width="2" height="4.8"/><rect x="6" y="2.4" width="2" height="6.6"/><rect x="9" y=".6" width="2" height="8.4"/></svg>
        <svg width="12" height="9" viewBox="0 0 12 9" fill="none" stroke="#9a9a9a" stroke-width="1.1"><path d="M1 6.2c1.8-2 4-2.9 6.6 0"/><path d="M2.8 7.2c1.1-1.1 2.4-1.5 3.8 0"/><circle cx="6" cy="8.1" r=".55" fill="#9a9a9a" stroke="none"/></svg>
        <svg width="20" height="9" viewBox="0 0 20 9"><rect x=".4" y="1.1" width="16.2" height="6.8" rx="1.2" stroke="#9a9a9a" fill="none"/><rect x="1.7" y="2.3" width="11" height="4.4" rx=".3" fill="#9a9a9a"/><rect x="17.4" y="2.8" width="1.4" height="3.4" rx=".3" fill="#9a9a9a"/></svg>
      </span>
    </div>
    <div class="header"><div class="logo">10X Landscape</div></div>
    <div class="home-body">
      <p class="home-kicker">Your yard</p>
      <p class="home-line">A quiet page for the lawn, the quote, and the next visit.</p>
      <div class="home-card">Willow Creek · sample lot</div>
    </div>
    <button type="button" class="fab-f" id="fab-f" aria-label="Feedback">F</button>
  </div>

  <div class="phone sheet" id="list-screen" hidden>
    <div class="sheet-top">
      <button type="button" class="ghost" id="list-back">Back</button>
      <div class="sheet-title">Feedback</div>
      <span></span>
    </div>
    <input class="inset-field" id="search" placeholder="Search titles" />
    <div id="list" class="list"></div>
    <button type="button" class="btn sheet-btn" id="give-btn">GIVE FEEDBACK</button>
  </div>

  <div class="phone sheet" id="form-screen" hidden>
    <div class="sheet-top">
      <button type="button" class="ghost" id="form-back">Back</button>
      <div class="sheet-title">Give feedback</div>
      <span></span>
    </div>
    <div class="form-scroll" id="form-scroll">
      <label>Your name</label>
      <input class="inset-field" id="f-name" placeholder="Name" required />
      <label>Title</label>
      <input class="inset-field" id="f-title" placeholder="Title" required />
      <div id="similar" class="similar"></div>
      <label>Notes</label>
      <textarea class="inset-field area" id="f-notes" placeholder="Notes" rows="3"></textarea>
      <label>Audio</label>
      <input type="file" accept="audio/*" id="f-audio" />
      <label>Screenshot</label>
      <input type="file" accept="image/*" id="f-shot" />
      <label>Video</label>
      <input type="file" accept="video/*" id="f-video" />
      <label>Broken?</label>
      <div class="row">
        <button type="button" class="chip on" data-broken="no">No</button>
        <button type="button" class="chip" data-broken="yes">Yes</button>
      </div>
      <label>Importance <span id="imp-val">5</span></label>
      <input type="range" min="1" max="10" value="5" id="f-imp" />
      <label>Pledge to fund? (no charge)</label>
      <div class="row">
        <button type="button" class="chip on" data-donate="no">No</button>
        <button type="button" class="chip" data-donate="yes">Yes</button>
      </div>
      <input class="inset-field" id="f-amount" type="number" min="0" step="1" placeholder="Amount" hidden />
      <p class="fine" id="media-note"></p>
      <button type="button" class="btn sheet-btn" id="submit-btn">SUBMIT</button>
    </div>
  </div>

  <div class="phone sheet" id="item-screen" hidden>
    <div class="sheet-top">
      <button type="button" class="ghost" id="item-back">Back</button>
      <div class="sheet-title">Item</div>
      <span></span>
    </div>
    <div id="item-body" class="form-scroll"></div>
  </div>

<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
